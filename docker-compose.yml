# SEC450: lab servers, traffic generator, collector and API (REQ-12).
#
#   cp config.example.yaml config.yaml
#   cp .env.example .env          # optional; only needed for real Claude triage
#   docker compose up --build
#
# Only the api publishes a port (DD-10): https://localhost/ (host 443 -> container 8443).
# Lab: SSH server (ssh01), nginx (web01) and a JSON API app (app01) behind nginx, plus
# a traffic generator that rotates through one attack per detection rule (DD-03).

name: sec450

x-app: &app
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  image: sec450-app:local
  restart: unless-stopped
  env_file:
    - path: .env
      required: false

services:
  lab-ssh:
    build: docker/lab-ssh
    hostname: ssh01                       # matches sources[ssh_auth].host in config.yaml
    environment:
      TZ: America/Indiana/Indianapolis    # matches sources[ssh_auth].timezone, so the UTC conversion is exercised
    volumes:
      - ssh-logs:/var/log/ssh
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/22"]
      interval: 10s
      timeout: 3s
      retries: 5

  lab-nginx:
    build: docker/lab-nginx
    hostname: web01                       # matches sources[nginx_*].host in config.yaml
    environment:
      TZ: America/Indiana/Indianapolis    # matches sources[nginx_*].timezone
    volumes:
      - nginx-logs:/var/log/lab-nginx
    networks:
      lab:
        ipv4_address: 172.20.0.10         # collector.trusted_proxies: the app trusts X-Forwarded-For only from here
    depends_on:
      - lab-app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  lab-app:
    build: docker/lab-app
    hostname: app01                       # matches sources[app].host
    volumes:
      - app-logs:/var/log/app
    networks:
      - lab
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 3)"]
      interval: 10s
      timeout: 3s
      retries: 5

  traffic-gen:
    build: docker/traffic-gen
    depends_on:
      lab-ssh:
        condition: service_healthy
      lab-nginx:
        condition: service_healthy
    networks:
      - default
      - lab
    restart: unless-stopped

  collector:
    <<: *app
    command: ["python", "-m", "sec450.worker"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - db:/data                          # the one SQLite file, shared with the api (DD-06)
      - ssh-logs:/logs/ssh:ro             # read-only: the collector never changes a log (DD-04, REQ-08)
      - nginx-logs:/logs/nginx:ro
      - app-logs:/logs/app:ro
    healthcheck:
      # Healthy while the collection loop keeps touching its heartbeat file (see sec450/worker.py).
      test: ["CMD", "python", "-c",
             "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/sec450-collector.heartbeat') > 400)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  api:
    <<: *app
    command: ["python", "-m", "sec450.api"]
    environment:
      SEC450_SELF_SIGNED_CERT: "1"        # entrypoint creates a TLS cert on first start
    ports:
      - "443:8443"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - db:/data
      - certs:/certs
    depends_on:
      collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c",
             "import ssl,urllib.request; urllib.request.urlopen('https://localhost:8443/health', context=ssl._create_unverified_context(), timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Analyst dashboard (DD-16). It reads only through the api, with its own key
  # (DASHBOARD_API_KEY in .env), so every view is authenticated and audited. No port is
  # published; reach it through the dashboard tunnel below (behind Cloudflare Access).
  dashboard:
    <<: *app
    command: ["python", "-m", "streamlit", "run", "sec450/dashboard/app.py",
              "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true",
              "--browser.gatherUsageStats=false"]
    env_file: []                          # needs only its own key, not the secrets in .env
    environment:
      HOME: /tmp                          # streamlit writes its settings under $HOME
      SEC450_API_KEY: ${DASHBOARD_API_KEY:-}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - certs:/certs:ro                   # the api's certificate, to verify it (dashboard.ca_cert)
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Optional public access through a Cloudflare tunnel (seclog.redinbo.win).
  # Only starts with the "tunnel" profile: set COMPOSE_PROFILES=tunnel in .env.
  # The connection is outbound, so no port is published and the api stays the
  # only entry point (DD-10).
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml",
              "run", "${CLOUDFLARE_TUNNEL_ID:-}"]
    volumes:
      - ./docker/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./secrets/cloudflared.json:/etc/cloudflared/credentials.json:ro
      - certs:/certs:ro                   # the api's certificate, to verify the origin
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional public access to the dashboard through its own Cloudflare tunnel.
  # Starts with the "dashboard-tunnel" profile. Put Cloudflare Access in front of
  # the tunnel's hostname first: the dashboard has no login of its own.
  cloudflared-dashboard:
    image: cloudflare/cloudflared:2024.12.2
    profiles: ["dashboard-tunnel"]
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml",
              "run", "${DASHBOARD_TUNNEL_ID:-}"]
    volumes:
      - ./docker/cloudflared/dashboard.yml:/etc/cloudflared/config.yml:ro
      - ./secrets/cloudflared-dashboard.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      dashboard:
        condition: service_healthy
    restart: unless-stopped

networks:
  # Web lab network with a fixed range, so nginx's address matches collector.trusted_proxies.
  lab:
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  ssh-logs:
  nginx-logs:
  app-logs:
  db:
  certs:

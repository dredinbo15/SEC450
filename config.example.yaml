# SEC450 log analysis - single configuration file (REQ-12, AC-30).
# Copy to config.yaml. Paths below are paths INSIDE the containers (see docker-compose.yml).
# Secrets do not go here: put ANTHROPIC_API_KEY in .env.

database_path: /data/sec450.db

sources:
  - name: nginx_access
    kind: nginx_access
    host: web01
    path: /logs/nginx/access.log
    timezone: America/Indiana/Indianapolis
  - name: nginx_error
    kind: nginx_error
    host: web01
    path: /logs/nginx/error.log
    timezone: America/Indiana/Indianapolis
  - name: ssh_auth
    kind: ssh_auth
    host: ssh01
    path: /logs/ssh/auth.log
    timezone: America/Indiana/Indianapolis
  - name: app
    kind: app
    host: app01
    path: /logs/app/app.log
    timezone: UTC

collector:
  interval_seconds: 60          # 1..300 (REQ-01)
  read_retries: 3               # failures before a collection gap opens (REQ-07)
  retry_delay_seconds: 2
  clock_skew_seconds: 300       # future timestamps beyond this are flagged
  quarantine_warn_ratio: 0.05   # health warning when malformed lines exceed this share of a batch
  trusted_proxies:              # X-Forwarded-For is only honored from these peers (REQ-02)
    - 172.20.0.10/32

detection:
  lookback_seconds: 900         # how far past the rule window to re-scan each cycle
  rules:
    - id: R1
      name: SSH/app brute force
      kind: failed_login_count
      severity: high
      threshold: 5
      window_seconds: 300
    - id: R2
      name: 404 scan
      kind: distinct_404
      severity: medium
      threshold: 20
      window_seconds: 60
    - id: R3
      name: Path traversal or injection
      kind: pattern
      severity: high
      threshold: 1
      window_seconds: 300
      patterns:
        - '(?i)\.\./|\.\.\\|%2e%2e(%2f|/|%5c)'
        - "(?i)('|%27)\\s*(or|and)\\s+\\S+\\s*=|union(\\s|\\+|%20)+select|;\\s*drop\\s+table|sleep\\(\\d+\\)"
        - '(?i)<script|%3cscript|javascript:'
        - '(?i);\s*(cat|ls|wget|curl|id)\b|\|\s*sh\b|\$\('
    - id: R4
      name: Large data transfer
      kind: bytes_sum
      severity: critical
      threshold: 10485760         # strictly greater than 10 MB
      window_seconds: 600

geoip:                          # missing files are fine: ASN and country are stored as null
  asn_db: /app/geoip/GeoLite2-ASN.mmdb
  country_db: /app/geoip/GeoLite2-Country.mmdb

triage:
  enabled: true
  client: mock                  # mock = built-in fake LLM, no key needed; claude = real API (key in .env)
  api_key: null                 # leave null; the key is read from ANTHROPIC_API_KEY (.env)
  model: claude-opus-5-5
  effort: low
  server_fallbacks: true        # reroute to a fallback model on a safety refusal
  timeout_seconds: 30
  retries: 2                    # 3 attempts total (REQ-04)
  max_events: 50
  settle_seconds: 60            # quiet time before a cluster is frozen and triaged
  max_wait_seconds: 180         # triage anyway once a cluster is this old
  worker_interval_seconds: 15

retention:
  event_days: 30
  report_days: 90
  run_every_seconds: 3600

api:
  host: 0.0.0.0
  port: 8443
  tls_cert: /certs/server.crt   # created self-signed on first start if missing
  tls_key: /certs/server.key
  rate_limit_per_minute: 60
  max_span_days: 31
  default_span_hours: 24
  default_limit: 100
  max_limit: 1000

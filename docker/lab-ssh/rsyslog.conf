# Minimal rsyslog for the lab SSH container.
# imuxsock creates /dev/log, which sshd sends its messages to.
module(load="imuxsock")

# Classic syslog lines, for example:
#   Oct  8 10:00:05 ssh01 sshd[2002]: Failed password for root from 172.18.0.5 port 50001 ssh2
# (the format sec450/parsers/ssh.py parses). The file is world-readable because
# the collector runs as a non-root user on a read-only mount.
auth,authpriv.* action(type="omfile" file="/var/log/ssh/auth.log"
                       template="RSYSLOG_TraditionalFileFormat"
                       fileCreateMode="0644" dirCreateMode="0755")

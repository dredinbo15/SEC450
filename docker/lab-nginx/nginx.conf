# Lab nginx (web01). The access log format is the one sec450/parsers/nginx.py parses:
# combined plus X-Forwarded-For. Times use the container's TZ, matching
# sources[nginx_*].timezone in config.yaml.
worker_processes 1;
error_log /var/log/lab-nginx/error.log warn;

events { worker_connections 256; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format lab '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/lab-nginx/access.log lab;

    server {
        listen 80;
        server_name web01;
        root /usr/share/nginx/lab;
        index index.html;

        # Default static handling: a missing file is a 404 and an error-log line
        # ('open() ... failed (2: No such file or directory)'), as on a real server.
        location / {
        }

        # Docker healthcheck; kept out of the access log so it isn't lab traffic.
        location = /healthz {
            access_log off;
            return 204;
        }

        # The lab app. nginx is the trusted proxy (collector.trusted_proxies), so the app
        # logs nginx as its peer and the real client from X-Forwarded-For (REQ-02, AC-05).
        location /api/ {
            proxy_pass http://lab-app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Compose images
        run: docker compose build
        env:
          POSTGRES_PASSWORD: ci-build-only   # docker-compose.yml requires it; nothing connects during a build

  test:
    name: Run tests
    runs-on: ubuntu-latest
    services:
      # Tests create and drop one database per test on this server (tests/conftest.py).
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SEC450_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest

  static-checks:
    name: Run static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check sec450 tests docker

      - name: Type check with mypy
        run: mypy sec450

      - name: Security scan with Bandit
        run: bandit -c pyproject.toml -r sec450 docker
